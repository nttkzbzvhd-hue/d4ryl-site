  <!-- Open Graph / preview when shared -->

  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; display: grid; place-items: center; text-align: center; }
    a { color: #1DB954; text-decoration: none; font-weight: 600; }
    p { opacity: 0.7; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>D4RYL — ADollar?!</h1>
    <p>Opening Spotify…</p>
    <p><a href="https://open.spotify.com/track/5pa5YSoB54NfG3o4RVt9NO">Tap here if nothing happens</a></p>
  </main>
  <script>
    (function () {
      var trackId = '5pa5YSoB54NfG3o4RVt9NO';
      var webUrl  = 'https://open.spotify.com/track/' + trackId;
      var appUri  = 'spotify:track:' + trackId;
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (!isMobile) {
        window.location.replace(webUrl);
        return;
      }

      // Mobile: try the native app URI; fall back to web only if the page
      // stays visible (i.e. the app didn't take over).
      var appOpened = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) appOpened = true;
      });
      window.addEventListener('pagehide', function () { appOpened = true; });
      window.addEventListener('blur',     function () { appOpened = true; });

      setTimeout(function () {
        if (!appOpened) window.location.replace(webUrl);
      }, 1500);

      window.location.href = appUri;
    })();
  </script>
</body>
</html>
