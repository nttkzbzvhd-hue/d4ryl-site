<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HalbSchlaf — Zwischenraum</title>
  <meta name="description" content="HalbSchlaf — Zwischenraum. Out 14. August 2026." />

  <!-- Open Graph / preview when shared -->
  <meta property="og:type" content="music.song" />
  <meta property="og:title" content="HalbSchlaf — Zwischenraum" />
  <meta property="og:description" content="Neue Single. Out 14. August 2026." />
  <meta property="og:image" content="https://kernelrec.com/halbschlaf/assets/zwischenraum-cover.jpg" />
  <meta property="og:url" content="https://kernelrec.com/zwischenraum" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HalbSchlaf — Zwischenraum" />
  <meta name="twitter:description" content="Neue Single. Out 14. August 2026." />
  <meta name="twitter:image" content="https://kernelrec.com/halbschlaf/assets/zwischenraum-cover.jpg" />

  <!--
    ══════════════════════════════════════════════════════════════════════════
    NACH RELEASE 2026-08-14:
      1. Diese Seite auf Hard-Redirect umbauen (Muster: /adollar/index.html)
      2. `<meta http-equiv="refresh">` + `<link rel="canonical">` + JS-Redirect
         auf Halbschlaf-Spotify-Track-URL zeigen lassen
      3. App-Deep-Link `spotify:track:<ID>` für Mobile-First-App-Open ergänzen
    ══════════════════════════════════════════════════════════════════════════
  -->

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #eaeaea;
      --muted: rgba(234,234,234,0.55);
      --accent: #e9d9b8;
      --border: rgba(255,255,255,0.08);
      --card: rgba(255,255,255,0.03);
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; padding: 40px 24px; max-width: 420px; width: 100%; box-sizing: border-box; }
    .cover { display: block; width: 100%; max-width: 320px; margin: 0 auto 28px;
      border-radius: 8px; border: 1px solid var(--border); }
    h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; font-weight: 700; }
    .artist { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px;
      letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin: 0 auto 28px; max-width: 320px; }
    .cd-box { padding: 10px 6px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border); }
    .cd-num { font-family: "Courier New", monospace; font-size: 22px;
      font-weight: 600; color: var(--accent); line-height: 1; }
    .cd-label { font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-top: 4px; }
    .release-live {
      font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 20px; font-weight: 700;
      display: none;
    }
    .btn { display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; margin: 4px; border-radius: 6px;
      font-family: "Courier New", monospace; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s; }
    .btn-primary { background: var(--accent); color: #0a0a0a;
      border: 1px solid var(--accent); }
    .btn-primary:hover { box-shadow: 0 0 12px rgba(233,217,184,0.4); }
    .btn-outline { background: transparent; color: var(--text);
      border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 24px;
      line-height: 1.55; }
    .meta a { color: var(--accent); text-decoration: none; }
    footer { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      font-family: "Courier New", monospace; font-size: 9px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(234,234,234,0.3); }
    footer a { color: inherit; margin: 0 8px; text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img class="cover"
         src="https://kernelrec.com/halbschlaf/assets/zwischenraum-cover.jpg"
         alt="HalbSchlaf — Zwischenraum" />

    <h1>Zwischenraum</h1>
    <p class="artist">HalbSchlaf</p>

    <div class="countdown" id="countdown" aria-label="Countdown bis Release">
      <div class="cd-box">
        <div class="cd-num" id="cd-days">—</div>
        <div class="cd-label">Tage</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="cd-hours">—</div>
        <div class="cd-label">Std</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="cd-mins">—</div>
        <div class="cd-label">Min</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="cd-secs">—</div>
        <div class="cd-label">Sek</div>
      </div>
    </div>

    <p class="release-live" id="release-live">Out Now</p>

    <div>
      <a href="#" id="presave-btn" class="btn btn-primary btn-disabled" onclick="return handlePresave(event)">
        Pre-save
      </a>
      <a href="/halbschlaf" class="btn btn-outline">Zur Seite</a>
    </div>

    <p class="meta">
      HalbSchlaf · Kernel Records<br>
      Out 14. August 2026
    </p>
  </main>

  <footer>
    <a href="/">Home</a>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </footer>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // TODO(pre-release): sobald TuneCore Smart-Link steht, PRESAVE_URL setzen
    //                    und `btn-disabled` beim Presave-Button entfernen
    // ═══════════════════════════════════════════════════════════════════════
    var PRESAVE_URL = '';  // e.g. 'https://social.tunecore.com/linkShare?linkid=…'

    function handlePresave(e) {
      e.preventDefault();
      if (!PRESAVE_URL) {
        alert('Pre-save-Link kommt in Kürze. Speichere die Seite oder folg @halbschlaf.');
        return false;
      }
      window.open(PRESAVE_URL, '_blank');
      return false;
    }

    if (PRESAVE_URL) {
      document.getElementById('presave-btn').classList.remove('btn-disabled');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Countdown 2026-08-14 00:00 Uhr Europe/Berlin (CEST = UTC+2 im August)
    // ═══════════════════════════════════════════════════════════════════════
    var TARGET = new Date('2026-08-14T00:00:00+02:00').getTime();

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function tick() {
      var now = Date.now();
      var diff = TARGET - now;
      if (diff <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('release-live').style.display = 'block';
        return;
      }
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);      s -= d * 86400;
      var h = Math.floor(s / 3600);       s -= h * 3600;
      var m = Math.floor(s / 60);         s -= m * 60;
      document.getElementById('cd-days').textContent  = pad(d);
      document.getElementById('cd-hours').textContent = pad(h);
      document.getElementById('cd-mins').textContent  = pad(m);
      document.getElementById('cd-secs').textContent  = pad(s);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
